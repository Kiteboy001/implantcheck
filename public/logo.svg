<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <!-- Gold arc (top-left) -->
  <path d="M200 20 A 50 50 0 0 1 250 70" stroke="#A6893B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Navy arc (bottom-right) -->
  <path d="M200 120 A 50 50 0 0 1 150 70" stroke="#001B3D" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Implant body (gold) -->
  <rect x="187" y="62" width="6" height="20" rx="2" fill="#A6893B"/>
  <rect x="189" y="78" width="2" height="8" rx="1" fill="#C4A44A"/>
  <!-- Implant threads -->
  <line x1="185" y1="72" x2="195" y2="72" stroke="#A6893B" stroke-width="1.5"/>
  <line x1="185" y1="76" x2="195" y2="76" stroke="#A6893B" stroke-width="1.5"/>
  
  <!-- Crown (gold) -->
  <path d="M186 62 L184 54 Q190 50 196 54 L194 62" fill="#C4A44A"/>
  <path d="M186 62 Q190 58 194 62" fill="#D4B860"/>
  
  <!-- Navy checkmark overlay -->
  <path d="M180 70 L188 78 L202 62" stroke="#001B3D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text: IMPLANT (navy) -->
  <text x="210" y="72" font-family="Georgia, 'EB Garamond', serif" font-size="22" font-weight="700" fill="#001B3D">IMPLANT</text>
  <!-- Text: CHECK (gold) -->
  <text x="340" y="72" font-family="Georgia, 'EB Garamond', serif" font-size="22" font-weight="700" fill="#A6893B">CHECK</text>
  <!-- TM symbol -->
  <text x="402" y="64" font-family="sans-serif" font-size="9" fill="#001B3D">™</text>
  
  <!-- Tagline -->
  <line x1="150" y1="96" x2="210" y2="96" stroke="#A6893B" stroke-width="0.8"/>
  <text x="220" y="100" font-family="sans-serif" font-size="9" font-weight="600" fill="#001B3D" letter-spacing="2">PLAN BETTER. PLACE BETTER.</text>
  <line x1="380" y1="96" x2="440" y2="96" stroke="#A6893B" stroke-width="0.8"/>
  
  <!-- Subtitle -->
  <text x="230" y="118" font-family="sans-serif" font-size="8" fill="#001B3D" letter-spacing="1.5">EXPERT IMPLANT PLANNING. CONFIDENCE IN EVERY CASE.</text>
</svg>
